"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 3000

# Set color palette 
palette = 'catppuccin_frappe'

format = """
[](red)\
$os\
$username\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](bg:green fg:yellow)\
$c\
$cpp\
$dart\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$kotlin\
$lua\
$nim\
$python\
$ruby\
$rust\
$scala\
$typst\
$zig\
[](bg:sky fg:green)\
$bun\
$deno\
$dotnet\
$nodejs\
[](bg:sapphire fg:sky)\
$gradle\
$maven\
$container\
$docker_context\
$kubernetes\
[](bg:lavender fg:sapphire)\
$time\
[](fg:lavender)\
$line_break\
$character"""

# Replace the '❯' symbol in the prompt with '$'
[character]
success_symbol = '[\$](bold white)'
error_symbol = '[✗](bold red)'
vimcmd_symbol = '[\$](bold green)'
vimcmd_replace_one_symbol = '[\$](bold purple)'
vimcmd_replace_symbol = '[\$](bold purple)'
vimcmd_visual_symbol = '[\$](bold yellow)'

[os]
style = "bg:red fg:crust"
disabled = false

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user ]($style)'
disabled = false

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Developer" = "󰲋 "

# [cmd_duration]
# show_milliseconds = true
# style = "fg:crust bg:lavender"
# format = "[ 󱦟 $duration ]($style)"

[time]
disabled = false
time_format = "%R"             # Hour:Minute Format
style = "fg:crust bg:lavender"
format = '[  $time ]($style)'

[git_branch]
symbol = ""
style = "fg:crust bg:yellow"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:crust bg:yellow"
format = '[($all_status $ahead_behind )]($style)'

# language
[c]
symbol = " "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

[cpp]
symbol = " "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

[dart]
symbol = " "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

[elixir]
symbol = " "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

[elm]
symbol = " "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

[golang]
symbol = "󰟓 "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

[haskell]
symbol = " "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

[java]
symbol = " "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

[julia]
symbol = " "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

[kotlin]
symbol = " "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

[lua]
symbol = " "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

[nim]
symbol = " "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

[python]
symbol = " "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

[ruby]
symbol = " "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

[rust]
symbol = " "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

[scala]
symbol = " "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

[typst]
symbol = " "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

[xmake]
symbol = "△ "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

[zig]
symbol = " "
style = "bg:green fg:crust"
format = '[ $symbol( $version) ]($style)'

# runtime
[bun]
symbol = " "
style = "bg:sky fg:crust"
format = '[ $symbol( $version) ]($style)'

[deno]
symbol = " "
style = "bg:sky fg:crust"
format = '[ $symbol( $version) ]($style)'

[dotnet]
symbol = " "
style = "bg:sky fg:crust"
format = '[ $symbol( $version) ]($style)'

[nodejs]
symbol = "󰎙 "
style = "bg:sky fg:crust"
format = '[ $symbol( $version) ]($style)'

# software
[container]
symbol = " "
style = "bg:sapphire fg:crust"
format = "[ $symbol $name ]($style)"

[docker_context]
symbol = " "
style = "bg:sapphire fg:crust"
format = '[ $symbol $context ]($style)'

[gradle]
symbol = " "
style = "bg:sapphire fg:crust"
format = '[ $symbol( $version) ]($style)'

[kubernetes]
symbol = " "
style = "bg:sapphire fg:crust"
format = '[ $symbol( $version) ]($style)'

[maven]
symbol = " "
style = "bg:sapphire fg:crust"
format = '[ $symbol( $version) ]($style)'

